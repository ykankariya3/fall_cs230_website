# Temporary GitPage Host setup
title: CS230 Deep Learning
baseurl: ""
repository: "cs230-stanford/website-fall-2024"

# Theme settings
doks:
    color_theme: blue
    header:
        logo:
            text: CS230
            image: true
        nav:
            - item_name: Syllabus
              item_url: 'https://docs.google.com/spreadsheets/u/4/d/1S62zSd6YW7HIWAIy0wh0YTeHlsUczZGkaynHEHX-H9M/edit?gid=0#gid=0'
              item_external: true
            - item_name: Office Hours
              item_url: '/officehours'
            - item_name: Project
              item_url: '/project'
            - item_name: Section
              item_url: '/section'
            - item_name: Lecture
              item_url: '/lecture'
            - item_name: Blog
              item_url: '/blog'
            - item_name: FAQ
              item_url: '/faq'
    footer:
        content:
            logo:
                text:
                image:
            copyright: Copyright &copy; 2026. - Stanford University <br>All rights reserved.
        social_list:
            # - network_name: facebook
            #   profile_url: '#'
            # - network_name: twitter
            #   profile_url: '#'
    google_analytics: UA-124237072-3
    comments:
        disqus_forum_shortname: # Add your disqus forum shortname to activate comments

# SASS settings
sass:
    sass_dir: ./doks-theme/_sass
    style: :compressed

# Jekyll settings
plugins_dir: ./_plugins
layouts_dir: ./doks-theme/_layouts
includes_dir: ./doks-theme/_includes
exclude: [ 'README.md', 'CHANGELOG.md', 'scripts', 'vendor']
permalink: /:title/

